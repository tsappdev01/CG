# Build and deploy CGTOOL to IIS on UATWEB01.
#
# Runs on the Default pool, whose agent is the service "Azure Pipelines Agent
# (TechSourcedxb.Default.UATWEB01Agent)" ON UATWEB01 itself. That is deliberate: the agent and the
# web site are the same machine, so the publish output is copied straight into place and nothing
# has to cross the network or be staged as an artifact.
#
# The site does not have to exist beforehand: the first deploy creates it, because the script that
# would create it lives in this repository and the agent's checkout is the only copy of it on the
# server. Set the ensureSite variable to false to turn that off.

# The build number, which is also the version shown at the foot of the sidebar. $(Rev:r) is a
# counter that restarts whenever the rest of the name changes -- with the date in front of it, that
# means it restarts each day: "07112026 v 1", "07112026 v 2", then "08112026 v 1" tomorrow.
name: $(Date:ddMMyyyy) v $(Rev:r)

trigger:
  branches:
    include:
      - main

pr: none

pool:
  name: Default

variables:
  projectPath: 'src/CGTOOL.Web/CGTOOL.Web.csproj'
  buildConfiguration: 'Release'
  publishPath: '$(Build.ArtifactStagingDirectory)\publish'
  # These match the site as it was actually built in IIS Manager on UATWEB01. The site name and
  # the host header are separate values because they differ here: the site is called "DIP CGS"
  # and answers for cg.dipark.com.
  siteName: 'DIP CGS'
  appPoolName: 'DIP CGS'
  siteHostName: 'cg.dipark.com'
  sitePath: 'C:\Websites\CGDIP'
  # Set to false once the site is settled, if you would rather CI never touched IIS configuration.
  ensureSite: 'true'
  aspNetCoreEnvironment: 'Production'

steps:
  # useGlobalJson, not a pinned version here: global.json already names the SDK (10.0.402) and two
  # places saying which SDK to use is one place to forget.
  - task: UseDotNet@2
    displayName: 'Install the SDK global.json asks for'
    inputs:
      packageType: 'sdk'
      useGlobalJson: true

  - script: dotnet restore "$(projectPath)" --runtime win-x64
    displayName: 'Restore'

  # Self-contained, matching the publish profile the site was first deployed with. It carries its
  # own .NET 10 runtime AND its own aspnetcorev2_inprocess.dll, so UATWEB01 needs nothing
  # installed -- it has 6, 8 and 9 but no 10, and a framework-dependent build there cannot start.
  # The cost is size: roughly 130MB per deploy instead of 30, which matters on a disk already at
  # 95%. The gain is that a runtime upgrade is a redeploy rather than a server change.
  #
  # InformationalVersion carries the build number into the assembly, which is where the site reads
  # it from to show "Build version: ..." at the foot of the sidebar. Stamped at publish rather than
  # kept in the csproj, so the number on screen is the one that produced the files on disk and
  # cannot drift from them. InformationalVersion and not Version: Version must be a valid version
  # number and "07112026 v 3" is not one.
  - script: >-
      dotnet publish "$(projectPath)" --configuration $(buildConfiguration) --no-restore
      --self-contained --runtime win-x64 --output "$(publishPath)"
      /p:InformationalVersion="$(Build.BuildNumber)"
    displayName: 'Publish (self-contained)'

  # Before the deploy, not by hand beforehand: the script that creates the site lives in this
  # repository, and the only copy of this repository on UATWEB01 is the one the agent checks out
  # here -- so telling someone to "run it on the server first" asks them to run a file that is not
  # there yet. It is guarded throughout and re-runnable, so after the first time it is a no-op
  # that also repairs a site someone has since changed by hand.
  - task: PowerShell@2
    displayName: 'Ensure the IIS site and app pool exist'
    condition: and(succeeded(), eq(variables['ensureSite'], 'true'))
    inputs:
      filePath: 'scripts/deploy/New-CgDiparkSite.ps1'
      arguments: >-
        -SiteName "$(siteName)"
        -AppPoolName "$(appPoolName)"
        -SitePath "$(sitePath)"
        -HostName "$(siteHostName)"
        -AspNetCoreEnvironment "$(aspNetCoreEnvironment)"
      failOnStderr: false
      pwsh: false

  - task: PowerShell@2
    displayName: 'Deploy to IIS'
    inputs:
      filePath: 'scripts/deploy/Deploy-ToIis.ps1'
      arguments: >-
        -PublishPath "$(publishPath)"
        -SitePath "$(sitePath)"
        -AppPoolName "$(appPoolName)"
      failOnStderr: false
      pwsh: false

  # Last, and always() so it runs even when the deploy failed -- a failed run leaves just as much
  # behind as a successful one, and this agent shares a disk with SQL Server that is already at
  # 95%. A self-contained publish is ~130MB a time, so without this the staging folder alone
  # accounts for a gigabyte over a handful of runs.
  #
  # Only what this pipeline created: the staging folder it published into, and the agent's own
  # temp directory, which is temporary by definition and is where the SDK archive is unpacked.
  # The checkout and the tool cache are left alone -- deleting those would mean re-downloading the
  # SDK and re-restoring every run.
  - task: PowerShell@2
    displayName: 'Clean up what this run left behind'
    condition: always()
    inputs:
      targetType: 'inline'
      pwsh: false
      script: |
        function Get-FreeGb {
            (Get-PSDrive -Name C).Free / 1GB
        }
        $before = Get-FreeGb

        foreach ($path in @('$(publishPath)', '$(Agent.TempDirectory)')) {
            if (-not (Test-Path $path)) { continue }
            # -ErrorAction SilentlyContinue throughout: something in temp may still be held by a
            # process, and failing the run over tidy-up would turn a good deploy red.
            Get-ChildItem $path -Force -ErrorAction SilentlyContinue |
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Cleared $path"
        }

        $after = Get-FreeGb
        Write-Host ("Free space on C: {0:N1} GB -> {1:N1} GB (reclaimed {2:N1} GB)." -f $before, $after, ($after - $before))
        if ($after -lt 5) {
            Write-Host "##vso[task.logissue type=warning]Under 5 GB free on C: after cleanup. This agent shares the disk with SQL Server; look at C:\inetpub\logs\LogFiles and the agent's _tool folder."
        }
