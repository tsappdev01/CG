# Build and deploy CGTOOL to IIS on UATWEB01.
#
# Runs on the Default pool, whose agent is the service "Azure Pipelines Agent
# (TechSourcedxb.Default.UATWEB01Agent)" ON UATWEB01 itself. That is deliberate: the agent and the
# web site are the same machine, so the publish output is copied straight into place and nothing
# has to cross the network or be staged as an artifact.
#
# The site does not have to exist beforehand: the first deploy creates it, because the script that
# would create it lives in this repository and the agent's checkout is the only copy of it on the
# server. Set the ensureSite variable to false to turn that off.

trigger:
  branches:
    include:
      - main

pr: none

pool:
  name: Default

variables:
  projectPath: 'src/CGTOOL.Web/CGTOOL.Web.csproj'
  buildConfiguration: 'Release'
  publishPath: '$(Build.ArtifactStagingDirectory)\publish'
  # These match the site as it was actually built in IIS Manager on UATWEB01. The site name and
  # the host header are separate values because they differ here: the site is called "DIP CGS"
  # and answers for cg.dipark.com.
  siteName: 'DIP CGS'
  appPoolName: 'DIP CGS'
  siteHostName: 'cg.dipark.com'
  sitePath: 'C:\Websites\CGDIP'
  # Set to false once the site is settled, if you would rather CI never touched IIS configuration.
  ensureSite: 'true'
  aspNetCoreEnvironment: 'Production'

steps:
  # useGlobalJson, not a pinned version here: global.json already names the SDK (10.0.402) and two
  # places saying which SDK to use is one place to forget.
  - task: UseDotNet@2
    displayName: 'Install the SDK global.json asks for'
    inputs:
      packageType: 'sdk'
      useGlobalJson: true

  - script: dotnet restore "$(projectPath)"
    displayName: 'Restore'

  - script: dotnet publish "$(projectPath)" --configuration $(buildConfiguration) --no-restore --output "$(publishPath)"
    displayName: 'Publish'

  # Before the deploy, not by hand beforehand: the script that creates the site lives in this
  # repository, and the only copy of this repository on UATWEB01 is the one the agent checks out
  # here -- so telling someone to "run it on the server first" asks them to run a file that is not
  # there yet. It is guarded throughout and re-runnable, so after the first time it is a no-op
  # that also repairs a site someone has since changed by hand.
  - task: PowerShell@2
    displayName: 'Ensure the IIS site and app pool exist'
    condition: and(succeeded(), eq(variables['ensureSite'], 'true'))
    inputs:
      filePath: 'scripts/deploy/New-CgDiparkSite.ps1'
      arguments: >-
        -SiteName "$(siteName)"
        -AppPoolName "$(appPoolName)"
        -SitePath "$(sitePath)"
        -HostName "$(siteHostName)"
        -AspNetCoreEnvironment "$(aspNetCoreEnvironment)"
      failOnStderr: false
      pwsh: false

  - task: PowerShell@2
    displayName: 'Deploy to IIS'
    inputs:
      filePath: 'scripts/deploy/Deploy-ToIis.ps1'
      arguments: >-
        -PublishPath "$(publishPath)"
        -SitePath "$(sitePath)"
        -AppPoolName "$(appPoolName)"
      failOnStderr: false
      pwsh: false
